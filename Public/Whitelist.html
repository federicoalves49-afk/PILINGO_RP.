<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whitelist - PILINGO RP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>PILINGO RP - Whitelist</h1>
</header>

<section class="formulario">

<h2>Solicitud de Whitelist</h2>

<form id="whitelistForm">

<label>Nombre completo</label>
<input type="text" required>

<label>Edad</label>
<input type="number" min="16" required>

<label>Usuario de Discord</label>
<input type="text" placeholder="Usuario#0000" required>

<label>Steam ID o Rockstar ID</label>
<input type="text" required>

<label>Nombre del personaje</label>
<input type="text" required>

<label>Historia del personaje</label>
<textarea rows="8" required></textarea>

<h3>Preguntas de Rol</h3>

<label>¿Qué significa RDM?</label>
<textarea required></textarea>

<label>¿Qué significa VDM?</label>
<textarea required></textarea>

<label>¿Qué es Metagaming?</label>
<textarea required></textarea>

<label>¿Qué es Powergaming?</label>
<textarea required></textarea>

<label>
<input type="checkbox" required>
Acepto las reglas del servidor.
</label>

<button type="submit">
Enviar Solicitud
</button>

</form>

</section>

<script src="whitelist.js"></script>

</body>
</html>
