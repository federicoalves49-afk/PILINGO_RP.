<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro | PILINGO RP</title>

<link rel="stylesheet" href="style.css">

<script type="module" src="register.js" defer></script>
</head>

<body>

<div class="login-box">

<h1>Crear Cuenta</h1>

<form id="registerForm">

<input
type="email"
id="email"
placeholder="Correo electrónico"
required>

<input
type="password"
id="password"
placeholder="Contraseña"
required>

<button>
Registrarse
</button>

</form>

<p>

¿Ya tienes cuenta?

<a href="login.html">

Inicia sesión

</a>

</p>

</div>

</body>
</html>
